# Same fixture, but with the human-handoff path armed (handoff_mode: eager).
# Flow: / -> /login?gate=checkpoint -> /checkpoint (human-only click gate) ->
#       /captcha -> /dashboard
name: testsite-human
url: http://testsite:5000/
login_url: http://testsite:5000/login?gate=checkpoint
after_login_url: http://testsite:5000/dashboard

success_url_patterns:
  - /dashboard
success_selectors:
  - "#dashboard"

handoff_url_patterns:
  - /checkpoint
handoff_selectors:
  - "#human-btn"

# eager = a matching rule parks the live session for a human immediately
handoff_mode: eager

login_selectors:
  email: "#email"
  password: "#pass"
  submit: "#submit"

credentials:
  email: ${SITE_EMAIL}
  password: ${SITE_PASSWORD}
