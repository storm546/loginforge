# Local E2E fixture target - the agent must clear everything itself.
# Flow: / -> /login -> /verify (Arkose/FunCaptcha, solved via 2captcha) ->
#       /captcha (reCAPTCHA v2 test key, solved via 2captcha) -> /dashboard
name: testsite
url: http://testsite:5000/
login_url: http://testsite:5000/login
after_login_url: http://testsite:5000/dashboard

success_url_patterns:
  - /dashboard
success_selectors:
  - "#dashboard"

# "hard zone" hints: the agent is nudged to work through them itself.
handoff_url_patterns:
  - /verify
handoff_selectors: []

# auto = solver first, then the agent's own interaction, handoff only as a fallback
handoff_mode: auto

login_selectors:
  email: "#email"
  password: "#pass"
  submit: "#submit"

credentials:
  email: ${SITE_EMAIL}
  password: ${SITE_PASSWORD}
